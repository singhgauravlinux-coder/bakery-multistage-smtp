apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------------------------------------------------------
# DEV overlay
#   - one namespace per env, everything else inherited from ../../base
#   - 1 replica per service (cheap, fast feedback)
#   - images are pinned per-service by the service's own CI pipeline via
#     `kustomize edit set image` (see .github/workflows/_service-pipeline.yml)
# ---------------------------------------------------------------------------

  # Every service Deployment has exactly one container, so a positional
  # JSON6902 patch (index 0) works regardless of container name and applies
  # identically to all 25 services in one shot.
namespace: bakery-dev

resources:
- ../../base
- ../../base/ingress

commonLabels:
  environment: dev

    
















# Image tags are rewritten in-place by each service's pipeline, e.g.:
#   images:
#     - name: ghcr.io/OWNER/bakery-language/auth-service
#       newTag: <short-sha>
# The blanket replicas patch above also hits notification-worker. Delivery
# throughput should scale independently of the API, and SKIP LOCKED claiming
# makes extra replicas safe, so it is set explicitly here (this patch is
# listed after the blanket one, so it wins).





























# The verification email links back into the SPA, so the base URL has to be
# this environment's public host or the link lands on the wrong stack.




patches:
- path: patch-ingress-host.yaml
  target:
    kind: Ingress
    name: bakery-ingress
- path: patch-ingress-middleware.yaml
  target:
    kind: Ingress
    name: bakery-ingress
- path: patch-db-ingress-host.yaml
  target:
    kind: Ingress
    name: bakery-db-ingress
- path: patch-docs-ingress-host.yaml
  target:
    kind: Ingress
    name: bakery-docs-ingress
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi

    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    labelSelector: app.kubernetes.io/part-of=crumb-and-ember
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: notification-worker
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-service
    spec:
      template:
        spec:
          containers:
            - name: auth-service
              env:
                - name: APP_BASE_URL
                  value: "http://dev.bakery.local"
  target:
    kind: Deployment
    name: auth-service

