# notification-worker — consumer half of the notification service.
#
# Runs the SAME image as notification-service with a different command, so the
# existing notification-service CI pipeline and the per-overlay image pinning
# cover it automatically (kustomize `images:` matches on image name, not on
# Deployment). It takes no inbound traffic, so there is deliberately no
# Service object — only the kubelet talks to its probe port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: bakery
  labels:
    app: notification-worker
    app.kubernetes.io/part-of: crumb-and-ember
    app.kubernetes.io/component: worker
spec:
  # Workers claim jobs with FOR UPDATE SKIP LOCKED, so replicas can be raised
  # freely — two rows are never handed to two pods.
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
        app.kubernetes.io/component: worker
    spec:
      # Long enough for an in-flight delivery to finish; the worker stops
      # claiming on SIGTERM and drains (WORKER_SHUTDOWN_GRACE_MS).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies every file in db/migrations (mounted via the
        # bakery-db-migrations ConfigMap) in order, idempotently, before the
        # main container starts. This is what actually fixes the
        # "relation notification_jobs does not exist" class of failure:
        # previously the worker self-migrated its own tables exactly once
        # at boot with no retry, and the readiness probe only checked DB
        # *connectivity* (SELECT 1), not schema presence — so a pod that
        # lost the race with Postgres coming up would pass readiness and
        # then spin forever on queries against tables that were never
        # created. An initContainer blocks pod readiness until every
        # migration has actually succeeded, and is retried by kubelet on
        # failure (RestartPolicy applies to initContainers too).
        - name: db-migrate
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: bakery-db-secret
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-migrations
              mountPath: /migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
          command:
            - sh
            - -c
            - |
              set -eu
              echo "waiting for postgres..."
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do
                sleep 2
              done
              echo "applying db/migrations..."
              for f in $(ls /migrations/*.sql | sort); do
                echo "  -> $(basename "$f")"
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "migrations applied."
      containers:
        - name: notification-worker
          image: ghcr.io/singhgauravlinux-coder/bakery-multistage-smtp/notification-service:2e71aee
          imagePullPolicy: Always
          command: ["node", "worker.js"]
          # Same public origin (and MAIL_SUPPORT) as notification-service:
          # the worker renders the template at send time, so both the CTA
          # links and the security "report it to" line are built here.
          envFrom:
            - secretRef:
                name: bakery-public-urls
                optional: true
          ports:
            - name: probe
              containerPort: 3110
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: "notification-worker"
            - name: WORKER_PROBE_PORT
              value: "3110"
            - name: LOG_LEVEL
              value: "info"
            - name: WORKER_BATCH_SIZE
              value: "10"
            - name: WORKER_CONCURRENCY
              value: "5"
            - name: WORKER_POLL_INTERVAL_MS
              value: "1000"
            - name: WORKER_IDLE_INTERVAL_MS
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bakery-db-secret
                  key: DATABASE_URL
            # SMTP settings come from the `smtp-credentials` Secret, which is
            # applied out of band with kubectl (see
            # k8s/base/secrets.smtp.example.yaml) so no credential is ever
            # committed or rendered into an overlay. Every key is optional:
            # without the Secret the worker still starts and mocks email.
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: port
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: secure
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: username
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: password
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: from
                  optional: true
            # Gmail throttles parallel sessions; keep the pool at 1 there.
            - name: SMTP_MAX_CONNECTIONS
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3110
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3110
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: db-migrations
          configMap:
            name: bakery-db-migrations
        - name: tmp
          emptyDir: {}
