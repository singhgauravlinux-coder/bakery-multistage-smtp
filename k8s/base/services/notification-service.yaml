apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: bakery
  labels:
    app: notification-service
    app.kubernetes.io/part-of: crumb-and-ember
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: ghcr.io/singhgauravlinux-coder/bakery-multistage-smtp/notification-service:2e71aee
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: bakery-public-urls
                optional: true
          ports:
            - containerPort: 3010
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: PORT
              value: "3010"
            - name: LOG_LEVEL
              value: "info"
            # APP_BASE_URL is supplied by the bakery-public-urls Secret
            # (envFrom below) — it is the origin every CTA in a mail is built
            # from: Order now, See the menu, Redeem now, Track this order and
            # the unsubscribe link. Not committed; see docs/PUBLIC_URLS.md.
            # Producer side of the queue — notification-worker drains it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bakery-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: bakery
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 3010
      targetPort: 3010
      protocol: TCP
